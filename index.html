<style>
  html,body{height:100%;overflow:hidden;}
  .chat-app{

    margin:0 auto;
    height:100vh;
    height:100dvh;
    display:flex;
    flex-direction:column;
    background:var(--bg-soft);
  }
  .chat-header{
    flex-shrink:0;
    display:flex;
    align-items:center;
    gap:11px;
    padding:14px 18px;
    background:#fff;
    border-bottom:1px solid var(--border);
  }
  .chat-header .avatar{
    width:38px;height:38px;border-radius:50%;
    background:var(--navy);
    color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:15px;
    flex-shrink:0;
    position:relative;
  }
  .chat-header .avatar::after{
    content:'';
    position:absolute;right:-1px;bottom:-1px;
    width:10px;height:10px;border-radius:50%;
    background:#39d353;border:2px solid #fff;
  }
  .chat-header .name{font-weight:800;font-size:14.5px;color:var(--navy);}
  .chat-header .status{font-size:11.5px;color:var(--text-dim);margin-top:1px;}

  .chat-messages{
    flex:1;
    overflow-y:auto;
    padding:18px 16px 10px;
    -webkit-overflow-scrolling:touch;
  }
  .msg-row{
    display:flex;
    margin-top:10px;
  }
  .msg-row.bot{justify-content:flex-start;}
  .msg-row.user{justify-content:flex-end;}
  .bubble{
    max-width:76%;
    min-width:0;
    padding:11px 14px;
    font-size:14px;
    line-height:1.55;
    white-space:pre-line;
    overflow-wrap:break-word;
    word-break:break-word;
  }
  .msg-row.bot .bubble{
    background:#fff;
    color:var(--text);
    border:1px solid var(--border);
    border-radius:4px 16px 16px 16px;
  }
  .msg-row.user .bubble{
    background:var(--navy);
    color:#fff;
    border-radius:16px 4px 16px 16px;
    font-weight:600;
  }
  .typing .bubble{
    display:flex;
    align-items:center;
    gap:4px;
    padding:13px 16px;
  }
  .typing .dot{
    width:6px;height:6px;border-radius:50%;
    background:#b7bccb;
    animation:tdot 1.1s infinite ease-in-out;
  }
  .typing .dot:nth-child(2){animation-delay:.15s;}
  .typing .dot:nth-child(3){animation-delay:.3s;}
  @keyframes tdot{
    0%,60%,100%{transform:translateY(0);opacity:.5;}
    30%{transform:translateY(-4px);opacity:1;}
  }

  .rich-card{max-width:90%;}

  .composer{

  .composer .field-err{margin:6px 6px 0;}

  .msg-row .col{flex:0 1 auto;max-width:calc(100% - 46px);}
  .rich-card .bonus-box{margin-top:0;}

</style>

var lead = {name:'', email:'', phone:''};
var step = 0;
var msgsEl = document.getElementById('chat-messages');
var composerEl = document.getElementById('composer');

function fmt(text){
  return text.replace('{name}', lead.name || '고객');
}

function scrollDown(){
  msgsEl.scrollTop = msgsEl.scrollHeight;
}

var BOT_NAME = '이지나';
var BOT_INITIAL = '이';

function nowTime(){
  var d = new Date(), h = d.getHours(), m = d.getMinutes();
  return (h < 12 ? '오전 ' : '오후 ') + ((h % 12) || 12) + ':' + (m < 10 ? '0' : '') + m;
}

function lastRealRow(){
  var rows = msgsEl.querySelectorAll('.msg-row:not(.typing)');
  return rows.length ? rows[rows.length - 1] : null;
}

/* 카톡처럼: 같은 사람이 이어서 보내면 프로필·이름은 첫 줄에만, 시간은 마지막 줄에만 */
function makeRow(role, contentEl, extraClass){
  var prev = lastRealRow();
  var cont = prev && prev.classList.contains(role);
  if(cont){
    var t = prev.querySelector('.time');
    if(t){ t.remove(); }
  }
  var row = document.createElement('div');
  row.className = 'msg-row ' + role + (extraClass ? ' ' + extraClass : '') + (cont ? '' : ' first');
  var line = document.createElement('div');
  line.className = 'line';
  var time = document.createElement('span');
  time.className = 'time';
  time.textContent = nowTime();
  if(role === 'bot'){
    var av = document.createElement('div');
    av.className = 'av' + (cont ? ' blank' : '');
    av.textContent = BOT_INITIAL;
    row.appendChild(av);
    var col = document.createElement('div');
    col.className = 'col';
    if(!cont){
      var nm = document.createElement('div');
      nm.className = 'nm';
      nm.textContent = BOT_NAME;
      col.appendChild(nm);
    }
    line.appendChild(contentEl);
    line.appendChild(time);
    col.appendChild(line);
    row.appendChild(col);
  } else {
    line.appendChild(time);
    line.appendChild(contentEl);
    row.appendChild(line);
  }
  return row;
}

function addBubble(role, text){
  var b = document.createElement('div');
  b.className = 'bubble';
  b.textContent = text;
  msgsEl.appendChild(makeRow(role, b));
  scrollDown();
}

function addRich(node){
  var card = document.createElement('div');
  card.className = 'rich-card';
  card.appendChild(node);
  msgsEl.appendChild(makeRow('bot', card, 'rich-row'));
  scrollDown();
}

function showTyping(){
  var prev = lastRealRow();
  var cont = prev && prev.classList.contains('bot');
  var row = document.createElement('div');
  row.className = 'msg-row bot typing' + (cont ? '' : ' first');
  row.id = 'typing-row';
  row.innerHTML = '<div class="av' + (cont ? ' blank' : '') + '">' + BOT_INITIAL + '</div>' +
    '<div class="col">' + (cont ? '' : '<div class="nm">' + BOT_NAME + '</div>') +
    '<div class="line"><div class="bubble"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div></div></div>';
  msgsEl.appendChild(row);
  scrollDown();
}

/* 카톡 입력창: 답장 버튼(칩)은 입력창 위에, 글자 입력은 입력창에서 */
function makeChips(labels, onPick){
  var chips = document.createElement('div');
  chips.className = 'chips';
  labels.forEach(function(label, i){
    var c = document.createElement('button');
    c.type = 'button';
    c.className = 'chip' + (i === 0 ? ' primary' : '');
    c.textContent = label;
    c.addEventListener('click', function(){ onPick(label); });
    chips.appendChild(c);
  });
  return chips;
}

function makeBar(enabled, placeholder){
  var bar = document.createElement('div');
  bar.className = 'kbar';
  var input = document.createElement('input');
  input.placeholder = placeholder || '';
  input.disabled = !enabled;
  var send = document.createElement('button');
  send.type = 'button';
  send.className = 'ksend';
  send.textContent = '전송';
  send.disabled = !enabled;
  bar.appendChild(input);
  bar.appendChild(send);
  return {bar: bar, input: input, send: send};
}

function renderReplyChips(labels, onPick){
  composerEl.appendChild(makeChips(labels, onPick));
  composerEl.appendChild(makeBar(false, '위 버튼을 눌러 답장하세요').bar);
}

function hideTyping(){

  el.innerHTML =
    '<div class="tag">이지나 실제 매출 변화</div>' +
    '<div class="row">' +
      '<div class="before"><div class="lbl">2025년 6월</div><div class="amt">12,790,000원</div></div>' +
      '<div class="arrow">→</div>' +
      '<div class="after"><div class="lbl">2026년 4월</div><div class="amt">22,170,000원</div></div>' +
    '</div>' +
    '<div class="growth-badge">10개월 만에 매출 +73% 성장</div>' +
    '<div class="growth-note">※ 월 300만원 → 3,000만원까지 성장한 사례도 있습니다</div>';
  return el;
}

function buildScheduleCard(){
  var el = document.createElement('div');
  el.className = 'urgency-box';
  el.innerHTML =
    '<div class="warn">🚨 단계별 가격 인상 진행 중!</div>' +
    '<div class="feature-list">' +
      '<div class="feature-item"><span class="ic">⚡</span><span class="tx"><b>결제 완료 즉시<br>PDF 파일 자동 다운로드</b></span></div>' +
      '<div class="feature-item"><span class="ic">📱</span><span class="tx"><b>마이페이지에서<br>언제든 다시 다운로드</b></span></div>' +
    '</div>' +
    '<div class="schedule">' +
      '<div class="sched-row done"><span>1차 판매가</span><span>59,000원 (마감)</span></div>' +
      '<div class="sched-row current"><span>2차 현재가</span><span class="price">79,000원 (판매중)</span></div>' +
      '<div class="sched-row next"><span>3차 판매가</span><span>99,000원 (인상예정)</span></div>' +
      '<div class="sched-row next"><span>4차 판매가</span><span>119,000원 (인상예정)</span></div>' +
    '</div>';
  return el;
}

function buildGiftCard(item){
  var el = document.createElement('div');
  el.className = 'bonus-box';
  el.innerHTML =
    '<span class="tag">' + item.tag + '</span>' +
    '<h4>' + item.title + '</h4>' +
    '<p>' + item.desc + '</p>';
  return el;
}

function buildConfirmCard(){
  var el = document.createElement('div');
  el.className = 'bonus-box';
  el.innerHTML =
    '<span class="tag">입력 확인</span>' +
    '<h4>입력하신 정보가 정확한가요?</h4>' +
    '<p>* 오타가 있으면 자료를 못 받으실 수 있어요<br>' +
    '성함 : ' + lead.name + '<br>' +
    '이메일 : ' + lead.email + '<br>' +
    '연락처 : ' + lead.phone + '</p>';
  return el;
}

function buildConsentCard(){
  var el = document.createElement('div');
  el.className = 'bonus-box';
  el.innerHTML =
    '<span class="tag">개인정보 수집·이용 동의</span>' +
    '<p style="font-size:12.5px;line-height:1.7;">' +
    '· 수집 주체: 아우라세일즈<br>' +
    '· 수집 항목: 성함, 이메일, 연락처<br>' +
    '· 이용 목적: 무료 자료 전달 및 관련 안내<br>' +
    '· 보유 기간: 수집일로부터 3년 (동의 철회 시 지체 없이 파기)<br>' +
    '· 동의를 거부하실 수 있으나, 이 경우 자료를 받으실 수 없습니다.</p>';
  return el;
}

function buildLinkCard(item){
  var el = document.createElement('div');
  el.className = 'bonus-box';
  el.innerHTML =
    '<span class="tag">무료 자료</span>' +
    '<h4>' + item.title + '</h4>' +
    '<p>' + item.desc + '</p>';
  (item.links || [[item.label, item.url]]).forEach(function(l, i){
    var a = document.createElement('a');
    a.href = l[1];
    a.target = '_blank';
    a.rel = 'noopener';
    a.className = 'cta-btn';
    a.style.cssText = 'margin-top:' + (i ? 8 : 12) + 'px;text-align:left;text-decoration:none;font-size:14px;padding:12px 14px;background:#fff;color:#191919;border:1px solid #f0d59a;';
    a.textContent = l[0] + '  받기 →';
    el.appendChild(a);
  });
  return el;
}

function renderConsent(){
  renderReplyChips(['동의하고 자료 받기'], function(){
    clearComposer();
    addBubble('user', '동의합니다');
    step++;
    setTimeout(playNext, 350);
  });
}

function findStepIndex(id){
  for(var i = 0; i < script.length; i++){
    if(script[i].id === id){ return i; }
  }
  return 0;
}

function renderConfirm(){
  renderReplyChips(['네, 맞습니다!', '수정할게요'], function(label){
    clearComposer();
    addBubble('user', label);
    if(label === '수정할게요'){
      lead = {name:'', email:'', phone:''};
      step = findStepIndex('name-step');
    } else {
      step++;
    }
    setTimeout(playNext, 350);
  });
}

function clearComposer(){
  composerEl.innerHTML = '';
}

function renderChoice(item){
  renderReplyChips(item.options, function(label){
    clearComposer();
    addBubble('user', label);
    step++;
    setTimeout(playNext, 350);
  });
}

function renderInput(item){
  var kb = makeBar(true, item.placeholder);
  var input = kb.input;
  var sendBtn = kb.send;
  input.type = item.field === 'phone' ? 'tel' : item.field === 'email' ? 'email' : 'text';
  input.maxLength = item.field === 'email' ? 60 : 20;
  composerEl.appendChild(kb.bar);

  var errEl = null;
  function showErr(msg){
    if(errEl){ errEl.remove(); }
    errEl = document.createElement('div');
    errEl.className = 'field-err';
    errEl.textContent = msg;
    composerEl.appendChild(errEl);
  }

  function submit(){
    var val = input.value.trim();
    if(item.field === 'name'){
      if(!val){ showErr('성함을 입력해주세요.'); return; }
    } else if(item.field === 'email'){
      if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val)){ showErr('올바른 이메일 주소를 입력해주세요.'); return; }
    } else if(item.field === 'phone'){
      var digits = val.replace(/[^0-9]/g, '');
      if(!/^01[0-9]{8,9}$/.test(digits)){ showErr('올바른 연락처를 입력해주세요. (예: 01012345678)'); return; }
      val = digits;
    }
    lead[item.field] = val;
    clearComposer();
    addBubble('user', val);
    step++;
    setTimeout(playNext, 350);
  }

  sendBtn.addEventListener('click', submit);
  input.addEventListener('keydown', function(e){
    if(e.key === 'Enter'){ submit(); }
  });
  setTimeout(function(){ input.focus(); }, 300);
}

function renderCta(item){
  var btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'cta-btn';
  btn.textContent = item.text;
  btn.addEventListener('click', function(){
    document.getElementById('page-loading').classList.add('show');
    setTimeout(function(){
      window.location.href = 'product.html';
    }, 550);
  });
  composerEl.appendChild(btn);
}

function playNext(){
  if(step >= script.length){ return; }
  var item = script[step];

  if(item.type === 'bot'){
    showTyping();
    var delay = 500 + Math.min(fmt(item.text).length * 14, 500);
    setTimeout(function(){
      hideTyping();
      addBubble('bot', fmt(item.text));
      step++;
      playNext();
    }, delay);
    return;
  }

  if(item.type === 'stat' || item.type === 'schedule' || item.type === 'gift' || item.type === 'own' || item.type === 'reviews'){
    showTyping();
    setTimeout(function(){
      hideTyping();
      var card = item.type === 'stat' ? buildStatCard() : item.type === 'schedule' ? buildScheduleCard() : item.type === 'own' ? buildOwnCard() : item.type === 'reviews' ? buildReviewsCard() : buildGiftCard(item);
      addRich(card);
      step++;
      playNext();
    }, 500);
    return;
  }

  if(item.type === 'confirm'){
    showTyping();
    setTimeout(function(){
      hideTyping();
      addRich(buildConfirmCard());
      renderConfirm();
    }, 500);
    return;
  }

  if(item.type === 'consent'){
    showTyping();
    setTimeout(function(){
      hideTyping();
      addRich(buildConsentCard());
      renderConsent();
    }, 500);
    return;
  }

  if(item.type === 'link'){
    showTyping();
    setTimeout(function(){
      hideTyping();
      addRich(buildLinkCard(item));
      step++;
      setTimeout(playNext, 1200);
    }, 500);
    return;
  }

  if(item.type === 'leadsave'){
    if(typeof saveLead === 'function'){
      saveLead(lead).catch(function(err){ console.error(err); });
    }
    step++;
    playNext();
    return;
  }

  if(item.type === 'choice'){ renderChoice(item); return; }
  if(item.type === 'input'){
    if(item.prompt){
      showTyping();
      setTimeout(function(){
        hideTyping();
        addBubble('bot', fmt(item.prompt));
        renderInput(item);
      }, 600);
    } else {
      renderInput(item);
    }
    return;
  }
  if(item.type === 'cta'){ renderCta(item); return; }
}

playNext();
</script>
