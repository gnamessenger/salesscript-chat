<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>고가상품 세일즈 화법 완전정복</title>
<meta name="description" content="1:1 컨설팅 770만원에 판매된 실전 세일즈 대본. 조혜영 대표와의 1:1 대화로 바로 확인해보세요.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800;900&display=swap" media="print" onload="this.media='all'">
<link rel="stylesheet" href="style.css">
<style>
  html,body{height:100%;overflow:hidden;}
  .chat-app{
    max-width:600px;
    margin:0 auto;
    height:100vh;
    height:100dvh;
    display:flex;
    flex-direction:column;
    background:var(--bg-soft);
  }
  .chat-header{
    flex-shrink:0;
    display:flex;
    align-items:center;
    gap:11px;
    padding:14px 18px;
    background:#fff;
    border-bottom:1px solid var(--border);
  }
  .chat-header .avatar{
    width:38px;height:38px;border-radius:50%;
    background:var(--navy);
    color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:15px;
    flex-shrink:0;
    position:relative;
  }
  .chat-header .avatar::after{
    content:'';
    position:absolute;right:-1px;bottom:-1px;
    width:10px;height:10px;border-radius:50%;
    background:#39d353;border:2px solid #fff;
  }
  .chat-header .name{font-weight:800;font-size:14.5px;color:var(--navy);}
  .chat-header .status{font-size:11.5px;color:var(--text-dim);margin-top:1px;}

  .chat-messages{
    flex:1;
    overflow-y:auto;
    padding:18px 16px 10px;
    -webkit-overflow-scrolling:touch;
  }
  .msg-row{
    display:flex;
    margin-top:10px;
  }
  .msg-row.bot{justify-content:flex-start;}
  .msg-row.user{justify-content:flex-end;}
  .bubble{
    max-width:76%;
    min-width:0;
    padding:11px 14px;
    font-size:14px;
    line-height:1.55;
    white-space:pre-line;
    overflow-wrap:break-word;
    word-break:break-word;
  }
  .msg-row.bot .bubble{
    background:#fff;
    color:var(--text);
    border:1px solid var(--border);
    border-radius:4px 16px 16px 16px;
  }
  .msg-row.user .bubble{
    background:var(--navy);
    color:#fff;
    border-radius:16px 4px 16px 16px;
    font-weight:600;
  }
  .typing .bubble{
    display:flex;
    align-items:center;
    gap:4px;
    padding:13px 16px;
  }
  .typing .dot{
    width:6px;height:6px;border-radius:50%;
    background:#b7bccb;
    animation:tdot 1.1s infinite ease-in-out;
  }
  .typing .dot:nth-child(2){animation-delay:.15s;}
  .typing .dot:nth-child(3){animation-delay:.3s;}
  @keyframes tdot{
    0%,60%,100%{transform:translateY(0);opacity:.5;}
    30%{transform:translateY(-4px);opacity:1;}
  }

  .rich-row{margin-top:12px;}
  .rich-card{max-width:90%;}
  .rich-card .growth-stat,
  .rich-card .urgency-box{margin-top:0;}

  .composer{
    flex-shrink:0;
    background:#fff;
    border-top:1px solid var(--border);
    padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  }
  .composer:empty{padding:0;border-top:none;}

  .choice-list{display:flex;flex-direction:column;gap:8px;}
  .choice-btn{
    width:100%;
    padding:13px 16px;
    border-radius:22px;
    border:1.5px solid var(--navy);
    background:#fff;
    color:var(--navy);
    font-weight:700;
    font-size:14px;
    cursor:pointer;
    text-align:center;
  }
  .choice-btn:active{background:var(--bg-soft);}

  .input-row{display:flex;gap:8px;align-items:center;}
  .input-row input{
    flex:1;
    padding:13px 16px;
    border-radius:22px;
    border:1.5px solid var(--border);
    font-size:14.5px;
    font-family:inherit;
    color:var(--text);
    outline:none;
  }
  .input-row input:focus{border-color:var(--navy);}
  .send-btn{
    flex-shrink:0;
    width:44px;height:44px;border-radius:50%;
    background:var(--navy);
    color:#fff;
    border:none;
    font-size:17px;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .field-err{
    margin-top:7px;
    font-size:12px;
    color:var(--red);
    font-weight:600;
  }

  .cta-btn{
    display:block;
    width:100%;
    padding:17px;
    border-radius:12px;
    border:none;
    background:var(--red);
    color:#fff;
    font-weight:800;
    font-size:15.5px;
    cursor:pointer;
  }
</style>
</head>
<body>

<!-- ============ 1st LANDING: CHATBOT ============ -->

<div class="chat-app">
  <div class="chat-header">
    <div class="avatar">조</div>
    <div>
      <div class="name">조혜영 · 고가상품세일즈</div>
      <div class="status">보통 몇 분 내로 답장해요</div>
    </div>
  </div>

  <div class="chat-messages" id="chat-messages"></div>

  <div class="composer" id="composer"></div>
</div>

<div class="page-loading" id="page-loading">로딩 중...</div>

<script>
var script = [
  {type:'bot', text:'안녕하세요 😊'},
  {type:'bot', text:'선착순 이벤트에 당첨되신 것을 축하드립니다 🎉'},
  {type:'bot', text:'1:1 컨설팅에서만 알려드리던 화법,\n핵심만 정리한 미리보기 자료를 무료로 받으실 수 있어요'},
  {type:'gift', tag:'무료 증정', title:'🎁 화법 미리보기 자료', desc:'1:1 컨설팅 핵심 문장만 골라 정리한 맛보기 버전이에요.'},
  {type:'bot', text:'단, 수량이 정해져 있으니'},
  {type:'bot', text:'지금 계약 잘 따내고 계시거나, 화법에 관심 없으신 분은 신청하지 마세요'},
  {type:'choice', options:['네, 받아볼게요']},
  {type:'bot', text:'이 자료, 저한테 직접 컨설팅받은 분들만 아는 내용이라 풀리자마자 조용히 마감되곤 해요'},
  {type:'choice', options:['그래도 신청할게요']},
  {type:'bot', text:'지금 이 글을 보는 동안에도 이번 기수는 마감됐을 수 있어요'},
  {type:'choice', options:['그래도 받을래요']},
  {type:'bot', text:'자료 전달을 위해 아래 정보를 입력해주세요'},
  {type:'input', id:'name-step', field:'name', prompt:'성함이 어떻게 되세요?', placeholder:'이름'},
  {type:'bot', text:'{name}님, 반갑습니다 :)'},
  {type:'bot', text:'아래 내용을 정확하게 입력해주세요'},
  {type:'input', field:'email', prompt:'이메일 주소를 남겨주시면 자료를 보내드려요', placeholder:'example@email.com'},
  {type:'input', field:'phone', prompt:'연락처도 남겨주시면 선점 알림까지 챙겨드릴게요', placeholder:'01012345678 (-없이)'},
  {type:'confirm'},
  {type:'leadsave'},
  {type:'bot', text:'감사합니다! 곧 자료 전달드릴게요'},
  {type:'bot', text:'앗, 잠시만요!'},
  {type:'bot', text:'{name}님께서 받으실 수 있는 특별한 혜택이 한 가지 더 있어요'},
  {type:'choice', options:['어떤 혜택인가요?']},
  {type:'bot', text:'혹시 고객이 거절할 때, 뭐라고 답해야 할지 막막했던 적 있으세요?'},
  {type:'gift', tag:'사전예약 특별 보너스', title:'🎁 마법의 반론 제기', desc:'"생각해볼게요", "돈이 없어요" — 어떤 거절이 나와도 바로 꺼내 쓰는 반론처리 스크립트 40개 이상.'},
  {type:'bot', text:'한 번만 익혀두면, 고객이 어떤 말로 거절하든 바로 꺼내 쓸 수 있어요'},
  {type:'bot', text:'1 니즈파악부터 클로징까지, 그대로 읽기만 하면 되고'},
  {type:'bot', text:'2 거절이 나오면 바로 반론 대본을 꺼내 쓰고'},
  {type:'bot', text:'3 계약은 자연스럽게 따라옵니다'},
  {type:'bot', text:'이 화법, 전체 버전으로 받아보실래요?'},
  {type:'choice', options:['네, 받을래요']},
  {type:'bot', text:'그 전에, 1분만 시간 내서 실제 수강생 후기 확인해주시겠어요?'},
  {type:'stat'},
  {type:'choice', options:['확인했습니다']},
  {type:'bot', text:'이 화법은 원래 1:1 컨설팅으로만, 770만원에 알려드리던 내용이에요'},
  {type:'bot', text:'하지만 {name}님께는 여기서만! 단돈 79,000원에 전체 대본을 받으실 수 있는 기회를 드릴게요'},
  {type:'schedule'},
  {type:'bot', text:'커피 두 잔 값 정도로 평생 써먹을 수 있는 화법이에요'},
  {type:'bot', text:'* 이 혜택은 지금 이 창을 나가면 다시 받을 수 없어요'},
  {type:'cta', text:'지금 79,000원에 화법 선점하기'}
];

var lead = {name:'', email:'', phone:''};
var step = 0;
var msgsEl = document.getElementById('chat-messages');
var composerEl = document.getElementById('composer');

function fmt(text){
  return text.replace('{name}', lead.name || '고객');
}

function scrollDown(){
  msgsEl.scrollTop = msgsEl.scrollHeight;
}

function addBubble(role, text){
  var row = document.createElement('div');
  row.className = 'msg-row ' + role;
  var b = document.createElement('div');
  b.className = 'bubble';
  b.textContent = text;
  row.appendChild(b);
  msgsEl.appendChild(row);
  scrollDown();
}

function addRich(node){
  var row = document.createElement('div');
  row.className = 'msg-row bot rich-row';
  var card = document.createElement('div');
  card.className = 'rich-card';
  card.appendChild(node);
  row.appendChild(card);
  msgsEl.appendChild(row);
  scrollDown();
}

function showTyping(){
  var row = document.createElement('div');
  row.className = 'msg-row bot typing';
  row.id = 'typing-row';
  row.innerHTML = '<div class="bubble"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>';
  msgsEl.appendChild(row);
  scrollDown();
}

function hideTyping(){
  var row = document.getElementById('typing-row');
  if(row){ row.remove(); }
}

function buildStatCard(){
  var el = document.createElement('div');
  el.className = 'growth-stat';
  el.innerHTML =
    '<div class="tag">1:1 컨설팅 수강생 실제 매출 변화</div>' +
    '<div class="row">' +
      '<div class="before"><div class="lbl">2025년 6월</div><div class="amt">12,790,000원</div></div>' +
      '<div class="arrow">→</div>' +
      '<div class="after"><div class="lbl">2026년 4월</div><div class="amt">22,170,000원</div></div>' +
    '</div>' +
    '<div class="growth-badge">10개월 만에 매출 +73% 성장</div>' +
    '<div class="growth-note">※ 월 300만원 → 3,000만원까지 성장한 사례도 있습니다</div>';
  return el;
}

function buildScheduleCard(){
  var el = document.createElement('div');
  el.className = 'urgency-box';
  el.innerHTML =
    '<div class="warn">🚨 단계별 가격 인상 진행 중!</div>' +
    '<div class="feature-list">' +
      '<div class="feature-item"><span class="ic">⚡</span><span class="tx"><b>결제 완료 즉시<br>PDF 파일 자동 다운로드</b></span></div>' +
      '<div class="feature-item"><span class="ic">💬</span><span class="tx"><b>카카오 알림톡으로<br>가이드 자동 발송</b></span></div>' +
    '</div>' +
    '<div class="schedule">' +
      '<div class="sched-row done"><span>1차 판매가</span><span>59,000원 (마감)</span></div>' +
      '<div class="sched-row current"><span>2차 현재가</span><span class="price">79,000원 (판매중)</span></div>' +
      '<div class="sched-row next"><span>3차 판매가</span><span>99,000원 (인상예정)</span></div>' +
      '<div class="sched-row next"><span>4차 판매가</span><span>119,000원 (인상예정)</span></div>' +
    '</div>';
  return el;
}

function buildGiftCard(item){
  var el = document.createElement('div');
  el.className = 'bonus-box';
  el.innerHTML =
    '<span class="tag">' + item.tag + '</span>' +
    '<h4>' + item.title + '</h4>' +
    '<p>' + item.desc + '</p>';
  return el;
}

function buildConfirmCard(){
  var el = document.createElement('div');
  el.className = 'bonus-box';
  el.innerHTML =
    '<span class="tag">입력 확인</span>' +
    '<h4>입력하신 정보가 정확한가요?</h4>' +
    '<p>* 오타가 있으면 자료를 못 받으실 수 있어요<br>' +
    '성함 : ' + lead.name + '<br>' +
    '이메일 : ' + lead.email + '<br>' +
    '연락처 : ' + lead.phone + '</p>';
  return el;
}

function findStepIndex(id){
  for(var i = 0; i < script.length; i++){
    if(script[i].id === id){ return i; }
  }
  return 0;
}

function renderConfirm(){
  var wrap = document.createElement('div');
  wrap.className = 'choice-list';

  var okBtn = document.createElement('button');
  okBtn.type = 'button';
  okBtn.className = 'choice-btn';
  okBtn.textContent = '네, 맞습니다!';
  okBtn.addEventListener('click', function(){
    clearComposer();
    addBubble('user', '네, 맞습니다!');
    step++;
    setTimeout(playNext, 350);
  });

  var editBtn = document.createElement('button');
  editBtn.type = 'button';
  editBtn.className = 'choice-btn';
  editBtn.textContent = '수정할게요';
  editBtn.addEventListener('click', function(){
    clearComposer();
    addBubble('user', '수정할게요');
    lead = {name:'', email:'', phone:''};
    step = findStepIndex('name-step');
    setTimeout(playNext, 350);
  });

  wrap.appendChild(okBtn);
  wrap.appendChild(editBtn);
  composerEl.appendChild(wrap);
}

function clearComposer(){
  composerEl.innerHTML = '';
}

function renderChoice(item){
  var wrap = document.createElement('div');
  wrap.className = 'choice-list';
  item.options.forEach(function(label){
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'choice-btn';
    btn.textContent = label;
    btn.addEventListener('click', function(){
      clearComposer();
      addBubble('user', label);
      step++;
      setTimeout(playNext, 350);
    });
    wrap.appendChild(btn);
  });
  composerEl.appendChild(wrap);
}

function renderInput(item){
  var row = document.createElement('div');
  row.className = 'input-row';
  var input = document.createElement('input');
  input.type = item.field === 'phone' ? 'tel' : item.field === 'email' ? 'email' : 'text';
  input.placeholder = item.placeholder;
  input.maxLength = 20;
  var sendBtn = document.createElement('button');
  sendBtn.type = 'button';
  sendBtn.className = 'send-btn';
  sendBtn.textContent = '→';
  row.appendChild(input);
  row.appendChild(sendBtn);
  composerEl.appendChild(row);

  var errEl = null;
  function showErr(msg){
    if(errEl){ errEl.remove(); }
    errEl = document.createElement('div');
    errEl.className = 'field-err';
    errEl.textContent = msg;
    composerEl.appendChild(errEl);
  }

  function submit(){
    var val = input.value.trim();
    if(item.field === 'name'){
      if(!val){ showErr('성함을 입력해주세요.'); return; }
    } else if(item.field === 'email'){
      if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val)){ showErr('올바른 이메일 주소를 입력해주세요.'); return; }
    } else if(item.field === 'phone'){
      var digits = val.replace(/[^0-9]/g, '');
      if(!/^01[0-9]{8,9}$/.test(digits)){ showErr('올바른 연락처를 입력해주세요. (예: 01012345678)'); return; }
      val = digits;
    }
    lead[item.field] = val;
    clearComposer();
    addBubble('user', val);
    step++;
    setTimeout(playNext, 350);
  }

  sendBtn.addEventListener('click', submit);
  input.addEventListener('keydown', function(e){
    if(e.key === 'Enter'){ submit(); }
  });
  setTimeout(function(){ input.focus(); }, 300);
}

function renderCta(item){
  var btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'cta-btn';
  btn.textContent = item.text;
  btn.addEventListener('click', function(){
    document.getElementById('page-loading').classList.add('show');
    setTimeout(function(){
      window.location.href = 'product.html';
    }, 550);
  });
  composerEl.appendChild(btn);
}

function playNext(){
  if(step >= script.length){ return; }
  var item = script[step];

  if(item.type === 'bot'){
    showTyping();
    var delay = 500 + Math.min(fmt(item.text).length * 14, 500);
    setTimeout(function(){
      hideTyping();
      addBubble('bot', fmt(item.text));
      step++;
      playNext();
    }, delay);
    return;
  }

  if(item.type === 'stat' || item.type === 'schedule' || item.type === 'gift'){
    showTyping();
    setTimeout(function(){
      hideTyping();
      var card = item.type === 'stat' ? buildStatCard() : item.type === 'schedule' ? buildScheduleCard() : buildGiftCard(item);
      addRich(card);
      step++;
      playNext();
    }, 500);
    return;
  }

  if(item.type === 'confirm'){
    showTyping();
    setTimeout(function(){
      hideTyping();
      addRich(buildConfirmCard());
      renderConfirm();
    }, 500);
    return;
  }

  if(item.type === 'leadsave'){
    if(typeof saveLead === 'function'){
      saveLead(lead).catch(function(err){ console.error(err); });
    }
    step++;
    playNext();
    return;
  }

  if(item.type === 'choice'){ renderChoice(item); return; }
  if(item.type === 'input'){ renderInput(item); return; }
  if(item.type === 'cta'){ renderCta(item); return; }
}

playNext();
</script>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="firebase-init.js"></script>

</body>
</html>
